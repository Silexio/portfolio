packages:
  - "."

# Chaînes transitives des plugins de bundler de @sentry/nextjs, qui ne tournent qu'au build (et
# le projet construit avec Turbopack, pas webpack). Rien n'atteint le Worker ni le navigateur,
# mais `pnpm audit` affichait 5 high sur un dépôt public : autant servir les versions corrigées.
# Chaînes transitives des plugins de bundler de @sentry/nextjs, qui ne tournent qu'au build
# (et le projet construit avec Turbopack, pas webpack) : rien n'atteint le Worker ni le
# navigateur. Ces deux-là se corrigent sans risque.
# brace-expansion reste volontairement NON forcé : seule la chaîne glob>minimatch est touchée
# par l'avis, mais un override global impose la v5, ESM à exports nommés, à minimatch@9 qui
# l'importe en export par défaut — le build casse, vérifié. pnpm 11 n'accepte pas de sélecteur
# à trois niveaux pour viser la seule chaîne fautive. À reprendre quand Sentry montera glob.
overrides:
  fast-uri: "^3.1.8"
  source-map-js: "^1.2.2"
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@next/env@16.2.9"
  - "@next/eslint-plugin-next@16.2.9"
  - "@next/swc-darwin-arm64@16.2.9"
  - "@next/swc-darwin-x64@16.2.9"
  - "@next/swc-linux-arm64-gnu@16.2.9"
  - "@next/swc-linux-arm64-musl@16.2.9"
  - "@next/swc-linux-x64-gnu@16.2.9"
  - "@next/swc-linux-x64-musl@16.2.9"
  - "@next/swc-win32-arm64-msvc@16.2.9"
  - "@next/swc-win32-x64-msvc@16.2.9"
  - eslint-config-next@16.2.9
  - next@16.2.9
  - eslint@10.9.1
  - '@opennextjs/aws@4.1.9'
  - '@opennextjs/cloudflare@1.20.10'
