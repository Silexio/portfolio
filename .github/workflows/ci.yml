name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Lecture seule par défaut (principe du moindre privilège).
permissions:
  contents: read

# Annule les runs obsolètes d'une même branche/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # `lint`, `test` et `build` étaient tous verts le jour où le site entier a répondu 404 : ils
  # vérifient le code et la sortie de Next, jamais ce que le Worker sert. Ce travail sert ce qui
  # sera déployé, dans workerd, et le relit.
  smoke:
    name: Servi par workerd
    runs-on: ubuntu-latest
    # Le contrôle tient en 40 s en local : au-delà de 8 minutes c'est un blocage, pas une lenteur,
    # et mieux vaut échouer vite que se faire annuler au bout de 20.
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Figée dans le bundle au moment du build : absente, la réservation part morte en production.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke test
        run: pnpm smoke
