name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Lecture seule par défaut (principe du moindre privilège).
permissions:
  contents: read

# Annule les runs obsolètes d'une même branche/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Les 48 tests Playwright ne protégeaient que la machine du développeur : un flux de réservation
  # ou un formulaire cassé passait la CI sans rien déclencher. Ils tournent sur `next dev`, qui
  # compile à la demande, d'où le plafond de 2 workers déjà fixé dans playwright.config.ts.
  e2e:
    name: Parcours navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Le widget anti-robot est bouchonné par les tests, mais une clé vide désactive le bouton
      # d'envoi : sans elle, les scénarios de formulaire échoueraient pour la mauvaise raison.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le projet `mobile` est l'iPhone 13, dont le navigateur par défaut est WebKit, pas
      # Chromium : n'installer que Chromium faisait échouer les 25 tests mobiles d'un bloc,
      # pendant que les 23 tests bureau passaient.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # `lint`, `test` et `build` étaient tous verts le jour où le site entier a répondu 404 : ils
  # vérifient le code et la sortie de Next, jamais ce que le Worker sert. Ce travail sert ce qui
  # sera déployé, dans workerd, et le relit.
  smoke:
    name: Servi par workerd
    runs-on: ubuntu-latest
    # Le contrôle tient en 40 s en local : au-delà de 8 minutes c'est un blocage, pas une lenteur,
    # et mieux vaut échouer vite que se faire annuler au bout de 20.
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Figée dans le bundle au moment du build : absente, la réservation part morte en production.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke test
        run: pnpm smoke
